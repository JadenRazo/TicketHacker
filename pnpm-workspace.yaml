packages:
  - packages/*

allowBuilds:
  '@nestjs/core': true
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': false
  argon2: true
  esbuild: true
  msgpackr-extract: true
  prisma: true
  unrs-resolver: true

# Security overrides for transitive dependency CVEs (2026-08)
overrides:
  brace-expansion@1: ^1.1.18
  brace-expansion@2: ^2.1.4
  brace-expansion@5: ^5.0.9
  js-yaml@3: ^3.15.0
  js-yaml@4: ^4.3.0
  fast-uri@3: ^3.1.4
  undici@6: ^6.27.0
  form-data@4: ^4.0.6
  multer@2: ^2.2.0
  esbuild@0.27: ^0.28.1
  qs@6: ^6.15.2
  defu@6: ^6.1.5
  flatted@3: ^3.4.2
  body-parser@2: ^2.3.0
  '@babel/core@7': ^7.29.6
  postcss@8: ^8.5.18
  ws@8: ^8.21.0
  engine.io@6: ^6.6.7
  socket.io-parser@4: ^4.2.6
  deepmerge-ts@7: ^8.0.0
  nanoid@3: ^3.3.18
